<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yuanyu Zheng | Signal Notes 技术博客</title>
    <meta
      name="description"
      content="Yuanyu Zheng 的个人技术博客，支持按相对路径读取并渲染 Markdown 文章。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a" aria-hidden="true"></div>
    <div class="bg-shape bg-shape-b" aria-hidden="true"></div>

    <header class="site-header">
      <img class="site-avatar" src="./img/KatoMegumi.jpg" alt="个人头像" />
      <p class="site-kicker">Personal Knowledge Base</p>
      <h1 class="site-title">Yuanyu Zheng · Signal Notes</h1>
      <p class="site-subtitle">
        记录工程实践、架构思考与代码笔记，Build in public, ship with clarity.
      </p>
      <div class="header-actions">
        <a class="header-link" href="./resources.html">资料与链接库</a>
        <a class="header-link" href="./interests.html">个人兴趣窗口</a>
      </div>
      <button id="backButton" class="back-button" type="button" hidden>
        返回文章列表
      </button>
    </header>

    <main class="layout">
      <section id="listView" class="panel list-panel">
        <div class="panel-head">
          <h2>最新文章</h2>
          <p id="listHint">正在从 <code>./posts/</code> 读取 Markdown 文章...</p>
        </div>
        <div id="categoryFilters" class="category-filters" aria-label="文章分类"></div>
        <div id="postList" class="post-list" aria-live="polite"></div>
      </section>

      <article id="postView" class="panel post-panel" hidden>
        <header class="post-head">
          <p id="postMeta" class="post-meta"></p>
          <h2 id="postTitle" class="post-title"></h2>
        </header>
        <div id="postContent" class="post-content"></div>
      </article>
    </main>

    <footer class="site-footer">
      <p>
        <a
          class="site-footer-link"
          href="https://blog.csdn.net/2403_87485932?spm=1000.2115.3001.5343"
          target="_blank"
          rel="noopener noreferrer"
          >CSDN 文章</a
        >
        · 郑源羽
      </p>
    </footer>

    <template id="postCardTemplate">
      <button class="post-card" type="button">
        <p class="post-card-date"></p>
        <p class="post-card-category"></p>
        <h3 class="post-card-title"></h3>
        <p class="post-card-summary"></p>
        <p class="post-card-tags"></p>
      </button>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="./script.js" defer></script>
  </body>
</html>
